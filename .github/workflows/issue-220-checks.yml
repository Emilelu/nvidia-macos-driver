# Checks for the issue #220 workaround branch (fork-only; the upstream repo has no CI).
# The full driver build needs the maintainer's local NVIDIA Darwin modeset archive and
# compile commands, which cannot run here. These jobs check what can be checked:
# the refusal-helper regressions the repo ships, and that the 615.78.08 set-mode
# reason patch applies cleanly, plus a syntax pass over the framebuffer kext source.
name: issue-220 checks

on:
  push:
    branches: [ "fix/issue-220-nvkms-mode-reject" ]
  workflow_dispatch:

jobs:
  refusal-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo regression tests over the refusal helpers and call sites
        run: python3 tools/test_refusal_reasons.py

  patch-615-setmode-reason:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the NVIDIA 615.78.08 NVKMS KAPI source
        run: |
          mkdir -p ogkm/a/kapi/src
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/NVIDIA/open-gpu-kernel-modules/615.78.08/src/nvidia-modeset/kapi/src/nvkms-kapi.c \
            -o ogkm/a/kapi/src/nvkms-kapi.c
          wc -l ogkm/a/kapi/src/nvkms-kapi.c
      - name: Apply 615-setmode-reason.patch and confirm the reason lines land
        run: |
          cd ogkm
          patch -p0 --dry-run < ../kexts/NVRM/patches/615-setmode-reason.patch
          patch -p0 < ../kexts/NVRM/patches/615-setmode-reason.patch
          echo "reason lines: $(grep -c '\[kapi\] set mode' a/kapi/src/nvkms-kapi.c)"
          grep -n '\[kapi\] set mode' a/kapi/src/nvkms-kapi.c
          test "$(grep -c '\[kapi\] set mode' a/kapi/src/nvkms-kapi.c)" -eq 2

  nvrmfb-macos-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone NVIDIA open-gpu-kernel-modules 615.78.08 (headers only build needs the tree)
        run: git clone --depth 1 --branch 615.78.08 https://github.com/NVIDIA/open-gpu-kernel-modules.git ogkm
      - name: Syntax check the framebuffer kext source (NVRMFB carries the issue #220 changes)
        run: |
          SDK=$(xcrun --show-sdk-path)
          KHDR="$SDK/System/Library/Frameworks/Kernel.framework/Headers"
          OGKM=$PWD/ogkm; NV="$OGKM/src/nvidia"; KMS="$OGKM/src/nvidia-modeset"
          xcrun clang++ -arch x86_64 -fapple-kext -mkernel -nostdinc -I"$KHDR" \
            -I"$PWD/kexts/NVRMFB" -I"$PWD/kexts/NVRMFB/fb" -I"$PWD/kexts/NVRM" -I"$PWD/kexts/NMHDA" \
            -I"$KMS/os-interface/include" -I"$KMS/kapi/interface" -I"$KMS/kapi/include" \
            -I"$OGKM/src/common/unix/nvidia-push/interface" -I"$KMS/interface" -I"$KMS/include" \
            -I"$OGKM/src/common/unix/common/inc" -I"$OGKM/src/common/modeset" \
            -I"$OGKM/src/common/unix/common/utils/interface" \
            -I"$OGKM/kernel-open/common/inc" -I"$OGKM/src/common/sdk/nvidia/inc" \
            -I"$OGKM/src/common/sdk/nvidia/inc/hw" -I"$OGKM/src/common/inc" -I"$OGKM/src/common/shared/inc" \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -std=c++17 -fno-rtti -fno-exceptions -fno-builtin -fno-common -O0 \
            -fsyntax-only kexts/NVRMFB/fb/nvrm-fb.cpp
      # Informational only: this file is untouched by the branch, and its real build needs the
      # maintainer's local compile_cmds.sh macro set (PORT_ATOMIC and friends come from there), which
      # cannot be reproduced here. The file's refusal helpers are covered by tools/test_refusal_reasons.py.
      - name: Syntax check the NVRM KAPI portability layer (informational)
        continue-on-error: true
        run: |
          SDK=$(xcrun --show-sdk-path)
          KHDR="$SDK/System/Library/Frameworks/Kernel.framework/Headers"
          OGKM=$PWD/ogkm; NV="$OGKM/src/nvidia"; KMS="$OGKM/src/nvidia-modeset"
          xcrun clang++ -arch x86_64 -fapple-kext -mkernel -nostdinc -I"$KHDR" \
            -I"$PWD/kexts/NVRM" \
            -I"$KMS/os-interface/include" -I"$KMS/kapi/interface" -I"$KMS/kapi/include" \
            -I"$OGKM/src/common/unix/nvidia-push/interface" -I"$KMS/interface" -I"$KMS/include" \
            -I"$OGKM/src/common/unix/common/inc" -I"$OGKM/src/common/modeset" \
            -I"$OGKM/src/common/unix/common/utils/interface" \
            -I"$OGKM/kernel-open/common/inc" \
            -I"$NV/arch/nvalloc/unix/include" -I"$NV/arch/nvalloc/common/inc" -I"$NV/arch/nvalloc/common/inc/gsp" \
            -I"$OGKM/src/common/sdk/nvidia/inc" -I"$OGKM/src/common/sdk/nvidia/inc/hw" -I"$OGKM/src/common/inc" \
            -I"$OGKM/src/common/shared/inc" -I"$NV/inc" -I"$NV/inc/os" -I"$NV/inc/kernel" -I"$NV/kernel/inc" -I"$NV/interface" \
            -I"$OGKM/src/common/nvlink/interface" -I"$OGKM/src/common/inc/swref" -I"$OGKM/src/common/inc/swref/published" \
            -I"$NV/inc/libraries" -I"$NV/src/libraries" -I"$NV/generated" -I"$NV/src/mm/uvm/interface" \
            -I"$OGKM/src/common/uproc/os/libos-v2.0.0/include" -I"$OGKM/src/common/uproc/os/common/include" \
            -I"$OGKM/src/common/inc/displayport" -I"$OGKM/src/common/nvlink/inband/interface" \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -std=c++17 -fno-rtti -fno-exceptions -fno-builtin -fno-common -O0 \
            -fsyntax-only kexts/NVRM/os-nvkms-xnu.cpp

  # Build the framebuffer kext this branch actually changes. NVRMFB is a single
  # translation unit against OGKM 615.78.08 + repo headers (proven by the syntax
  # job above) and links like NVAccel does; it needs no maintainer-local archive.
  # The [kapi] reason lines live in NVRM/NVKMS and stay upstream-only; what this
  # artifact carries is the behavioural half of the issue #220 workaround:
  # named flipResults, the level-4 single-head fallback and -nvrmhead0only.
  nvrmfb-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone NVIDIA open-gpu-kernel-modules 615.78.08
        run: git clone --depth 1 --branch 615.78.08 https://github.com/NVIDIA/open-gpu-kernel-modules.git ogkm
      - name: Build NVRMFB.kext (macOS 15 and macOS 26/Tahoe variants)
        run: |
          set -e
          SDK=$(xcrun --show-sdk-path)
          KHDR="$SDK/System/Library/Frameworks/Kernel.framework/Headers"
          OGKM=$PWD/ogkm; KMS="$OGKM/src/nvidia-modeset"
          INCLUDES=(-I"$KHDR" \
            -I"$PWD/kexts/NVRMFB" -I"$PWD/kexts/NVRMFB/fb" -I"$PWD/kexts/NVRM" -I"$PWD/kexts/NMHDA" \
            -I"$KMS/os-interface/include" -I"$KMS/kapi/interface" -I"$KMS/kapi/include" \
            -I"$OGKM/src/common/unix/nvidia-push/interface" -I"$KMS/interface" -I"$KMS/include" \
            -I"$OGKM/src/common/unix/common/inc" -I"$OGKM/src/common/modeset" \
            -I"$OGKM/src/common/unix/common/utils/interface" \
            -I"$OGKM/kernel-open/common/inc" -I"$OGKM/src/common/sdk/nvidia/inc" \
            -I"$OGKM/src/common/sdk/nvidia/inc/hw" -I"$OGKM/src/common/inc" -I"$OGKM/src/common/shared/inc")
          COMMON=(-arch x86_64 -fapple-kext -mkernel -nostdinc "${INCLUDES[@]}" \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -std=c++17 -fno-rtti -fno-exceptions -fno-builtin -fno-common -O2)
          LINK=(-arch x86_64 -fapple-kext -nostdlib -Xlinker -kext -lkmodc++ -lkmod -lcc_kext)
          mkdir -p build/macos15/NVRMFB.kext/Contents/MacOS
          xcrun clang++ "${COMMON[@]}" -c kexts/NVRMFB/fb/nvrm-fb.cpp -o build/macos15/nvrm-fb.o
          xcrun clang++ "${LINK[@]}" build/macos15/nvrm-fb.o -o build/macos15/NVRMFB.kext/Contents/MacOS/NVRMFB
          cp kexts/NVRMFB/fb/Info.plist build/macos15/NVRMFB.kext/Contents/Info.plist
          codesign -f -s - --timestamp=none build/macos15/NVRMFB.kext
          echo "macos15: $(stat -f %z build/macos15/NVRMFB.kext/Contents/MacOS/NVRMFB) B"
          mkdir -p build/macos26/NVRMFB.kext/Contents/MacOS
          xcrun clang++ "${COMMON[@]}" -DNM_TAHOE -c kexts/NVRMFB/fb/nvrm-fb.cpp -o build/macos26/nvrm-fb.o
          xcrun clang++ "${LINK[@]}" build/macos26/nvrm-fb.o -o build/macos26/NVRMFB.kext/Contents/MacOS/NVRMFB
          cp kexts/NVRMFB/fb/Info.plist build/macos26/NVRMFB.kext/Contents/Info.plist
          codesign -f -s - --timestamp=none build/macos26/NVRMFB.kext
          echo "macos26: $(stat -f %z build/macos26/NVRMFB.kext/Contents/MacOS/NVRMFB) B"
          mkdir -p artifact
          cp -R build/macos15/NVRMFB.kext artifact/NVRMFB-macos15.kext
          cp -R build/macos26/NVRMFB.kext artifact/NVRMFB-macos26-tahoe.kext
          cat > artifact/README-install.txt <<'EOF'
          NVRMFB.kext with the issue #220 workaround (branch fix/issue-220-nvkms-mode-reject)

          What this changes vs the stock 2.6.5 NVRMFB (default paths untouched):
            - flip results are logged with names ("result 1 (invalid params)")
            - level-4 fallback: if the mode set AND the flip onto the firmware mode are
              both refused, one single-head full mode set is attempted
            - boot-arg -nvrmhead0only: the first mode set leaves the heads no
              framebuffer owns alone (helps some AMD-platform boards)

          Install (macOS):
            1. Keep the stock nullmoth 2.6.5 install (NVRM.kext etc. stay as they are).
            2. sudo cp -R /Library/Extensions/NVRMFB.kext /Library/Extensions/NVRMFB.kext.bak
            3. sudo cp -R NVRMFB-<your-macos>.kext /Library/Extensions/NVRMFB.kext
            4. Re-run the package's install.sh (rebuilds the auxiliary kernel collection),
               or: sudo kmutil install -v --volume-root / --update-all
            5. Reboot.

          Notes:
            - This kext is ad-hoc signed (unsigned content). Loading it requires loose
              SIP (csr-active-config with the untrusted-kexts bit, e.g. 0xA43).
            - The [kapi] set-mode reason lines do NOT appear with this artifact; they
              live in the NVKMS source and need an upstream release.
            - If the boot gets worse, restore the .bak kext and rebuild the aux KC.
          EOF
      - name: Upload NVRMFB kexts
        uses: actions/upload-artifact@v4
        with:
          name: NVRMFB-kexts-issue220
          path: artifact/

  # Full release-style package: official 2.6.5 tarball with the fixed NVRMFB
  # swapped in (NVRM/NVKMS stay stock - they need the maintainer's chain) and
  # SHA256SUMS regenerated so install.sh's --strict check still passes.
  full-package:
    runs-on: ubuntu-latest
    needs: [nvrmfb-build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NVRMFB-kexts-issue220
          path: kexts
      - name: Download the official 2.6.5 package
        run: |
          curl -fsSL --retry 3 -o pkg.tar.gz \
            https://github.com/nullmoth/nvidia-macos-driver/releases/download/v2.6.5/nullmoth-nvidia-2.6.5.tar.gz
          sha256sum pkg.tar.gz
      - name: Swap the fixed NVRMFB.kext in and repackage
        run: |
          set -e
          mkdir pkg && tar xzf pkg.tar.gz -C pkg
          cp pkg/pkgroot/SHA256SUMS sha-orig.txt
          rm -rf pkg/pkgroot/Library/Extensions/NVRMFB.kext
          cp -R kexts/NVRMFB-macos15.kext pkg/pkgroot/Library/Extensions/NVRMFB.kext
          # regenerate the manifest exactly the way the original was built:
          # regular files AND symlinks (shasum follows links), relative paths, sorted
          (cd pkg/pkgroot && find . \( -type f -o -type l \) ! -name SHA256SUMS \
            | sed 's|^\./||' | sort | xargs sha256sum > SHA256SUMS)
          # gate: only NVRMFB lines may differ from the official manifest
          if diff sha-orig.txt pkg/pkgroot/SHA256SUMS | grep -v 'NVRMFB' | grep -Eq '^[<>]'; then
            echo "unexpected manifest drift outside NVRMFB:" >&2
            diff sha-orig.txt pkg/pkgroot/SHA256SUMS >&2
            exit 1
          fi
          (cd pkg/pkgroot && sha256sum -c --strict --quiet SHA256SUMS)
          chmod -R u+rwX,go+rX pkg/pkgroot
          chmod 755 pkg/pkgroot/install.sh
          find pkg/pkgroot -name '*.sh' -type f -exec chmod 755 {} +
          find pkg/pkgroot -path '*Contents/MacOS/*' -type f -exec chmod 755 {} +
          tar czf nullmoth-nvidia-2.6.5-issue220-fix.tar.gz -C pkg pkgroot
          ls -la nullmoth-nvidia-2.6.5-issue220-fix.tar.gz
      - name: Upload the full installer package
        uses: actions/upload-artifact@v4
        with:
          name: nullmoth-nvidia-2.6.5-issue220-fix
          path: nullmoth-nvidia-2.6.5-issue220-fix.tar.gz
